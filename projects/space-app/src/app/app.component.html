<div class="header">
  @for (item of navItems; track item) {
    <a
      *appIfFeatureEnabled="navItemFeatureNames[item]"
      [routerLink]="navItemRouterLinks[item]"
      routerLinkActive="active"
      >{{ navItemLabels[item] }}</a
    >
  }
</div>

@if (updateAvailable()) {
  <div class="update">
    Dostępna aktualizacja aplikacji
    <button (click)="activateUpdate()">Aktywuj</button>
  </div>
}

@if (isSubscribed()) {
  <button (click)="revokeSubscription()">Wyłącz powiadomienia</button>
} @else {
  <button (click)="requestSubscription()">Włącz powiadomienia</button>
}

@if (unrecoverableError()) {
  <div class="error">
    Wystąpił błąd krytyczny
    <button (click)="reloadApp()">Odśwież stronę</button>
  </div>
}

@if (busy()) {
  <div class="loading">Trwa przetwarzanie danych...</div>
}

<div class="container">
  <p>Wersja aplikacji: {{ appVersion }}</p>

  <router-outlet></router-outlet>
</div>

<router-outlet name="browser"></router-outlet>
<a2s-comm></a2s-comm>
