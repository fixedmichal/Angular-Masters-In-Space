<table>
  <thead>
  <tr>
    <th>Naszywka</th>
    <th>Nr lotu</th>
    <th>Misja</th>
    <th>Rakieta</th>
    <th>Sukces</th>
    <th>Data</th>
    <th>Miejsce</th>
    <th>Linki</th>
  </tr>
  </thead>
  @for (launch of launches(); track launch.id) {
    <tbody appLaunchesListItem [launch]="launch">
        <app-launch-details [details]="launch.details" (changedDetails)="updateDetails(launch, $event)"></app-launch-details>
    </tbody>
  } @empty {
    <tr><td colspan="8">Nie znaleziono lotów</td></tr>
  }
</table>
