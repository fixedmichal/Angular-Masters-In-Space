@if (isEditMode()) {
  <div>
    <textarea #detailsInput autofocus>{{ details() }}</textarea>
    <button type="button" (click)="turnEditModeOff()">Anuluj</button>
    <button type="button" (click)="emitChangedDetails(detailsInput.value)">
      Zapisz
    </button>
  </div>
} @else {
  <div class="read" (click)="turnEditModeOn()">{{ details() }}</div>
}
