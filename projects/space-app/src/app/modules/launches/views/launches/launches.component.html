<h2>Starty SpaceX</h2>

<app-launches-filters
  (paramsChange)="searchLaunches($event)"
  [params]="queryParams()"
/>

@let launchesValues = launches();

@if (launchesValues) {
  <app-launches-list
    [launches]="launchesValues"
    (launchDetailsUpdate)="onLaunchDetailsUpdate($event)"
  ></app-launches-list>
}
