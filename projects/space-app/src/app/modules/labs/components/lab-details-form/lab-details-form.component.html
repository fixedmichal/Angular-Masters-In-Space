<div>
  <div class="form-field inline">
    <label>Nazwa</label>
    <input
      type="text"
      [formField]="form().name"
      [class.ng-invalid]="form().name().invalid()"
    />
  </div>

  <div class="form-field inline">
    <label>Lokalizacja</label>
    <app-lab-moon-id-selector [formField]="form().moonId" />
  </div>
</div>

<div>
  <div class="form-field inline">
    <label>
      <input type="checkbox" [formField]="form().autonomous" />
      laboratorium autonomiczne
    </label>
  </div>

  <div class="form-field inline">
    <label>
      <input type="checkbox" [formField]="form().enableTags" />
      włącz tagowanie
    </label>
  </div>
</div>
