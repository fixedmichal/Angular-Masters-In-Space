<h2>Księżyce</h2>

<label class="search-field">
  Szukaj:
  <input type="text" (input)="query.next($event.target.value)" />
</label>

<label class="include-planets-checkbox">
  <input type="checkbox" (change)="toggleIncludePlanets()" />
  Uwzględnij planety
</label>

<ul>
  @for (moon of moons | async; track moon.id) {
    <li>
      <strong>{{ moon.name }} ({{ moon.planet }})</strong> -
      {{ moon.description }}
    </li>
  }
</ul>
