<h2>Czas marsjański</h2>

<ul>
  <li>Doba marsjańska (sol): 24 godziny, 39 minut, 35 sekund</li>
  <li>Rok marsjański trwa 669 sol'i czyli 686 dni ziemskich</li>
  <li>Rok marsjański dzieli się na 24 miesiące po 27/28 sol'i</li>
  <li>Więcej informacji <a href="http://ops-alaska.com/time/gangale_converter/calendar_clock.htm" target="_blank">Darian System</a></li>
</ul>

<p>
  Podaj datę ziemską:
</p>

<div class="calendar-form">
  <div class="form-field">
    <label for="earth-year">Rok</label>
    <input id="earth-year" type="number" [formField]="calendarForm.year">
  </div>

  <div class="form-field">
    <label for="earth-month">Miesiąc</label>
    <input id="earth-month" type="number" [formField]="calendarForm.month">
  </div>

  <div class="form-field">
    <label for="earth-day">Dzień</label>
    <input id="earth-day" type="number" [formField]="calendarForm.day">
  </div>
</div>

<p>
  Wyliczona data marsjańska: <strong>{{martianDate()}}</strong>
</p>
